# ============================================
# DevLog Hub - Docker Compose (Development)
# Hot reload support with volume mounts
# ============================================
version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database (Development)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: devlog-postgres-dev
    environment:
      POSTGRES_USER: devlog
      POSTGRES_PASSWORD: devlog_secret
      POSTGRES_DB: devlog
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlog"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devlog-dev-network

  # ==========================================
  # Redis Cache (Development)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: devlog-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devlog-dev-network

  # ==========================================
  # API Server (Development with Hot Reload)
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: devlog-server-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://devlog:devlog_secret@postgres:5432/devlog
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-not-for-production
    ports:
      - "3001:3001"
      - "9229:9229"  # Node.js debugger port
    volumes:
      # Mount source code for hot reload
      - ./server/src:/app/src:cached
      - ./server/prisma:/app/prisma:cached
      # Exclude node_modules (use container's)
      - /app/node_modules
    command: npm run dev
    networks:
      - devlog-dev-network

  # ==========================================
  # Web Dashboard (Development with Hot Reload)
  # ==========================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: devlog-web-dev
    depends_on:
      - server
    environment:
      NODE_ENV: development
      PORT: 3020
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      WATCHPACK_POLLING: "true"  # Enable polling for file changes
    ports:
      - "3020:3020"
    volumes:
      # Mount source code for hot reload
      - ./web/src:/app/src:cached
      - ./web/public:/app/public:cached
      # Exclude node_modules and .next
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - devlog-dev-network

  # ==========================================
  # Adminer (Database GUI for Development)
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: devlog-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - devlog-dev-network
    profiles:
      - tools

  # ==========================================
  # Redis Commander (Redis GUI for Development)
  # ==========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: devlog-redis-commander
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - devlog-dev-network
    profiles:
      - tools

# ==========================================
# Networks
# ==========================================
networks:
  devlog-dev-network:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_dev_data:
  redis_dev_data:
