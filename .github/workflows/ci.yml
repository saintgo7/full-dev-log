# DevLog Hub - Continuous Integration Pipeline
# Triggers on push to main/develop and PRs to main
# Runs lint, test, and build jobs with matrix strategy

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_PRIMARY: '20'
  GO_VERSION: '1.21'

jobs:
  # Lint TypeScript code in server and web
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [server, web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_PRIMARY }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Generate Prisma client (server only)
        if: matrix.project == 'server'
        working-directory: server
        run: npm run db:generate

      - name: Run ESLint
        working-directory: ${{ matrix.project }}
        run: npm run lint

  # Test server with Node.js matrix
  test-server:
    name: Test Server (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [18, 20]
      fail-fast: false
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: devlog
          POSTGRES_PASSWORD: devlog_test
          POSTGRES_DB: devlog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://devlog:devlog_test@localhost:5432/devlog_test
      JWT_SECRET: test-jwt-secret-for-ci
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run db:generate

      - name: Run database migrations
        working-directory: server
        run: npx prisma db push --skip-generate

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Run tests with coverage
        if: matrix.node-version == 20
        working-directory: server
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 7

  # Test web application
  test-web:
    name: Test Web (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [18, 20]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: web
        run: npm test --if-present

  # Test Go agent
  test-agent:
    name: Test Agent (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum

      - name: Download Go modules
        working-directory: agent
        run: go mod download

      - name: Run Go vet
        working-directory: agent
        run: go vet ./...

      - name: Run Go tests
        working-directory: agent
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: agent/coverage.out
          retention-days: 7

  # Build all services
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-server, test-web, test-agent]
    strategy:
      matrix:
        include:
          - service: server
            type: node
          - service: web
            type: node
          - service: agent
            type: go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js setup for server and web
      - name: Setup Node.js
        if: matrix.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_PRIMARY }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install Node dependencies
        if: matrix.type == 'node'
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Generate Prisma client
        if: matrix.service == 'server'
        working-directory: server
        run: npm run db:generate

      - name: Build Node project
        if: matrix.type == 'node'
        working-directory: ${{ matrix.service }}
        run: npm run build

      # Go setup for agent
      - name: Setup Go
        if: matrix.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum

      - name: Build Go agent
        if: matrix.type == 'go'
        working-directory: agent
        run: |
          go build -ldflags="-s -w" -o bin/devlog-agent ./cmd/agent

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/dist/
            ${{ matrix.service }}/bin/
            ${{ matrix.service }}/.next/
          retention-days: 7
          if-no-files-found: ignore

  # Summary job
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test-server, test-web, test-agent, build]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_SERVER_RESULT: ${{ needs.test-server.result }}
          TEST_WEB_RESULT: ${{ needs.test-web.result }}
          TEST_AGENT_RESULT: ${{ needs.test-agent.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" ]] || \
             [[ "$TEST_SERVER_RESULT" != "success" ]] || \
             [[ "$TEST_WEB_RESULT" != "success" ]] || \
             [[ "$TEST_AGENT_RESULT" != "success" ]] || \
             [[ "$BUILD_RESULT" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
