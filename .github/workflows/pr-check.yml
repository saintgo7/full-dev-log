# DevLog Hub - Pull Request Check Pipeline
# Triggers on PR opened/updated
# Runs quick checks and posts status comment

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Quick lint check
  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    outputs:
      server-status: ${{ steps.server-lint.outcome }}
      web-status: ${{ steps.web-lint.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run db:generate

      - name: Lint server
        id: server-lint
        working-directory: server
        continue-on-error: true
        run: npm run lint

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint web
        id: web-lint
        working-directory: web
        continue-on-error: true
        run: npm run lint

  # Type check
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    outputs:
      server-status: ${{ steps.server-types.outcome }}
      web-status: ${{ steps.web-types.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run db:generate

      - name: Type check server
        id: server-types
        working-directory: server
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check web
        id: web-types
        working-directory: web
        continue-on-error: true
        run: npx tsc --noEmit

  # Build verification
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    outputs:
      server-status: ${{ steps.server-build.outcome }}
      web-status: ${{ steps.web-build.outcome }}
      agent-status: ${{ steps.agent-build.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: agent/go.sum

      # Server build
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run db:generate

      - name: Build server
        id: server-build
        working-directory: server
        continue-on-error: true
        run: npm run build

      # Web build
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        id: web-build
        working-directory: web
        continue-on-error: true
        run: npm run build

      # Agent build
      - name: Build agent
        id: agent-build
        working-directory: agent
        continue-on-error: true
        run: go build -o bin/devlog-agent ./cmd/agent

  # Go checks
  go-check:
    name: Go Check
    runs-on: ubuntu-latest
    outputs:
      vet-status: ${{ steps.go-vet.outcome }}
      test-status: ${{ steps.go-test.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: agent/go.sum

      - name: Go vet
        id: go-vet
        working-directory: agent
        continue-on-error: true
        run: go vet ./...

      - name: Go test
        id: go-test
        working-directory: agent
        continue-on-error: true
        run: go test -short ./...

  # Post PR comment with status
  pr-comment:
    name: Post Status Comment
    runs-on: ubuntu-latest
    needs: [lint-check, type-check, build-check, go-check]
    if: always()
    steps:
      - name: Generate status comment
        id: comment
        env:
          LINT_CHECK_RESULT: ${{ needs.lint-check.result }}
          TYPE_CHECK_RESULT: ${{ needs.type-check.result }}
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          GO_CHECK_RESULT: ${{ needs.go-check.result }}
          SERVER_LINT: ${{ needs.lint-check.outputs.server-status }}
          WEB_LINT: ${{ needs.lint-check.outputs.web-status }}
          SERVER_TYPES: ${{ needs.type-check.outputs.server-status }}
          WEB_TYPES: ${{ needs.type-check.outputs.web-status }}
          SERVER_BUILD: ${{ needs.build-check.outputs.server-status }}
          WEB_BUILD: ${{ needs.build-check.outputs.web-status }}
          AGENT_BUILD: ${{ needs.build-check.outputs.agent-status }}
          GO_VET: ${{ needs.go-check.outputs.vet-status }}
          GO_TEST: ${{ needs.go-check.outputs.test-status }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        uses: actions/github-script@v7
        with:
          script: |
            const getStatus = (outcome) => {
              if (outcome === 'success') return ':white_check_mark: Passed';
              if (outcome === 'failure') return ':x: Failed';
              if (outcome === 'skipped') return ':warning: Skipped';
              return ':grey_question: Unknown';
            };

            const lintCheck = process.env.LINT_CHECK_RESULT;
            const typeCheck = process.env.TYPE_CHECK_RESULT;
            const buildCheck = process.env.BUILD_CHECK_RESULT;
            const goCheck = process.env.GO_CHECK_RESULT;

            const serverLint = process.env.SERVER_LINT;
            const webLint = process.env.WEB_LINT;
            const serverTypes = process.env.SERVER_TYPES;
            const webTypes = process.env.WEB_TYPES;
            const serverBuild = process.env.SERVER_BUILD;
            const webBuild = process.env.WEB_BUILD;
            const agentBuild = process.env.AGENT_BUILD;
            const goVet = process.env.GO_VET;
            const goTest = process.env.GO_TEST;

            const allPassed = [lintCheck, typeCheck, buildCheck, goCheck].every(s => s === 'success');
            const overallIcon = allPassed ? ':rocket:' : ':warning:';
            const overallText = allPassed ? 'All checks passed!' : 'Some checks need attention';

            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;
            const sha = process.env.SHA;
            const actor = process.env.ACTOR;

            const comment = `## ${overallIcon} PR Check Results

            ${overallText}

            ### Server
            | Check | Status |
            |-------|--------|
            | Lint | ${getStatus(serverLint)} |
            | Type Check | ${getStatus(serverTypes)} |
            | Build | ${getStatus(serverBuild)} |

            ### Web
            | Check | Status |
            |-------|--------|
            | Lint | ${getStatus(webLint)} |
            | Type Check | ${getStatus(webTypes)} |
            | Build | ${getStatus(webBuild)} |

            ### Agent (Go)
            | Check | Status |
            |-------|--------|
            | Vet | ${getStatus(goVet)} |
            | Build | ${getStatus(agentBuild)} |

            ---
            <details>
            <summary>Workflow Details</summary>

            - **Workflow Run**: [${runId}](https://github.com/${repo}/actions/runs/${runId})
            - **Commit**: \`${sha.substring(0, 7)}\`
            - **Triggered by**: ${actor}
            </details>
            `;

            return comment;

      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'PR Check Results'

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.comment.outputs.result }}
          edit-mode: replace

  # Final status check
  pr-status:
    name: PR Status
    runs-on: ubuntu-latest
    needs: [lint-check, type-check, build-check, go-check]
    if: always()
    steps:
      - name: Check overall status
        env:
          LINT_RESULT: ${{ needs.lint-check.result }}
          TYPE_RESULT: ${{ needs.type-check.result }}
          BUILD_RESULT: ${{ needs.build-check.result }}
          GO_RESULT: ${{ needs.go-check.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" ]] || \
             [[ "$TYPE_RESULT" != "success" ]] || \
             [[ "$BUILD_RESULT" != "success" ]] || \
             [[ "$GO_RESULT" != "success" ]]; then
            echo "One or more checks failed or were skipped"
            exit 1
          fi
          echo "All PR checks passed!"
